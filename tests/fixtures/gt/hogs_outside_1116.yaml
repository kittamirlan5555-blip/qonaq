# Независимая проверка на чужой камере (16.11.2026): Hog's Breath Saloon, двор (Key West), запись трансляции
# data/videos/live/hogs_breath_outside_key_west_20261116_0000Z.mp4 (1080p, 30 к/с, 19:00–20:00 по местному).
# Размечено ВРУЧНУЮ ПО КАДРАМ ДО ЗАПУСКА СИСТЕМЫ: кадры каждые 3 с по всему отрезку, спорные места — каждые 1–2 с.
# Точность времени — ±2–3 с. Время — секунды ОТ НАЧАЛА ФАЙЛА.
#
# Определения (как в docs/STAGED_TEST.md):
#   seated      — гость сел за пустой стол (момент посадки первого гостя);
#   served      — первый подход персонала к сидящим гостям (начало);
#   staff_visit — следующие подходы персонала к столу, ≥ 4 с (начало);
#   left        — последний гость отошёл от стола;
#   cleaned     — конец уборки (последнее действие персонала: убрал посуду / протёр / разложил меню).
# Персонал узнаётся по кадрам: серая футболка «Hog's Breath Saloon» + джинсовые шорты + поясная сумка (официантки),
# серая рубашка-поло + кепка + полотенце (уборщик). Хостес с меню — тоже персонал.
video: hogs_breath_outside_key_west_20261116_0000Z.mp4
window: [1080, 2880]          # 18:00–48:00 файла; оцениваются события внутри окна
calibration_window: [0, 900]  # 0:00–15:00 — обучение калибровки ролей (в окно не входит)
zones: configs/zones/hogs_outside.yaml
tables:
  T01: {name: "центр, 4 места", at_start: "заняты (компания из 4; один отходил 18:09–20:06)", visible: "целиком"}
  T02: {name: "низ справа", at_start: "свободен", visible: "стол обрезан снизу: второй гость и сторона подхода официанта — за краем кадра"}
  T03: {name: "низ слева", at_start: "заняты (2 гостьи весь отрезок)", visible: "стол обрезан снизу, сторона подхода видна"}
  T04: {name: "справа у края", at_start: "заняты (2 гостя)", visible: "правая сторона стола за краем кадра"}
  T05: {name: "дальний справа", at_start: "свободен", visible: "целиком; весь отрезок пуст, мимо ходят и стоят люди"}
events:
  # T01 — центр
  - {t: 1239, zone: T01, event: left,        note: "20:39 — компания встала в 20:18, постояла у стола, последний ушёл"}
  - {t: 1281, zone: T01, event: cleaned,     note: "21:21 — уборщик: посуда 20:48–21:00, протёр и разложил меню 21:06–21:21"}
  - {t: 1578, zone: T01, event: seated,      note: "26:18 — хостес разложила меню 26:09–26:15, гости сели"}
  - {t: 1651, zone: T01, event: served,      note: "27:31–28:17 — официантка принимает заказ (ждали 73 с)"}
  - {t: 1824, zone: T01, event: staff_visit, note: "30:24–31:12 — официантка, напитки/оплата с терминалом"}
  - {t: 2465, zone: T01, event: staff_visit, note: "41:05–41:10 — официантка, ~5 с"}
  # T02 — низ справа
  - {t: 1161, zone: T02, event: seated,      note: "19:21 — подошёл 19:11, постоял, сел"}
  # T03 — низ слева
  - {t: 2721, zone: T03, event: staff_visit, note: "45:21–45:39 — официантка принесла коробки с собой"}
  - {t: 2814, zone: T03, event: staff_visit, note: "46:54–47:03 — официантка"}
  # T04 — справа у края
  - {t: 1127, zone: T04, event: left,        note: "18:47 — первый ушёл 18:02–18:16, второй досидел до 18:46"}
  - {t: 1216, zone: T04, event: cleaned,     note: "20:16 — уборщик: стаканы 19:13–19:21 (8 с), протёр и меню 20:04–20:16"}
  - {t: 2597, zone: T04, event: seated,      note: "43:17 — сел первый, второй подсел в 44:33"}
# Что не оценивается (разметка по кадрам ненадёжна), [начало, конец] в секундах файла:
unscored:
  - {zone: T02, events: [served, staff_visit], span: [1080, 2880],
     note: "сторона подхода за краем кадра; видны 21:18–21:27 (официантка с тарелкой) и 23:45–24:00 (официантка); еду в 20:51 принесли из-за края"}
  - {zone: T04, events: [served, staff_visit], span: [2597, 2880],
     note: "до 48:00 подхода не видно, но правая сторона стола за краем кадра"}
  - {zone: T03, events: [staff_visit], span: [2685, 2692], note: "44:48 — официантка нагнулась ~3 с (< 4 с)"}
not_events:
  - {zone: T01, span: [1086, 1206], note: "один из гостей отошёл на 2 мин — стол занят, это не уход"}
  - {zone: T01, span: [1569, 1575], note: "хостес у пустого стола с меню — не посадка"}
  - {zone: T01, span: [2259, 2685], note: "37:39–44:45 гость стоит у своего стула (не персонал)"}
  - {zone: T01, span: [2720, 2722], note: "45:20 официантка с подносом прошла мимо (2 с) — не визит"}
  - {zone: T05, span: [1386, 1416], note: "23:06–23:36 мужчина стоит у пустого стола ~30 с — не посадка"}
  - {zone: T05, span: [2310, 2334], note: "38:30–38:54 люди с напитками стоят у пустого стола"}
alerts_forbidden:
  - {zone: T01, kind: no_waiter}     # подошли через 73 с
  - {zone: T01, kind: dirty_table}   # убрали через 42 с
  - {zone: T04, kind: dirty_table}   # убрали через 89 с
notes: >
  Официанты здесь в обычной одежде (серые футболки с логотипом), похожей на одежду гостей; уборщик — в поло и кепке.
  Толпа у бара проходит вплотную к столам T01/T03/T05.
