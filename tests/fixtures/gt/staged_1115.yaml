# Ручная разметка (подтверждена владельцем 15.11: подход в 5:04, в 3:32 — проход мимо) постановочного видео IMG_2972.MOV (9:17, iPhone, 60 к/с, портрет 1080×1920).
# Размечено по кадрам каждые 2 с и 0,5 с в спорных местах, ДО запуска системы. Время — секунды от начала файла.
# Правила разметки — как в qonaq/synth/scenario.py: seated = гость вошёл в зону стола; served/staff_visit = начало
# стояния персонала у стола; left = гость последний раз у стола; cleaned = конец уборки (персонал отошёл).
video: IMG_2972.MOV  # видео в git не кладём; детекции — tests/fixtures/replay/staged_1115_4fps.jsonl.gz
zones: tests/fixtures/zones/staged_1115.yaml
events:
  - {t: 136, zone: T01, event: seated}       # 2:15 вошёл «гость» (голубое поло), 2:19 сел
  - {t: 304, zone: T01, event: served}       # 5:04–5:21 «официант» (чёрная футболка) стоит у стола ~17 с — заказ
  - {t: 399, zone: T01, event: staff_visit}  # 6:39–6:47 приносит еду и чашку
  - {t: 482, zone: T01, event: staff_visit}  # 8:02–8:12 стоит у стола ~10 с (счёт)
  - {t: 496, zone: T01, event: left}         # 8:12 гость встал, 8:13–8:17 у окна за столом, 8:18 вышел из кадра
  - {t: 525, zone: T01, event: cleaned}      # 8:30–8:38 уносит посуду, 8:42–8:45 протирает стол, 8:46 ушёл
alerts_forbidden: [no_waiter, dirty_table]   # ждал 168 с < 180; стол не убран ~29 с < 300
not_events:
  - {from: 0,   to: 12,  what: "камеру ставят, рука в кадре"}
  - {from: 12,  to: 80,  what: "подготовка: двое ходят вокруг стола, убираются (не посетители)"}
  - {from: 80,  to: 135, what: "пустой стол — эталон"}
  - {from: 212, to: 219, what: "3:32–3:39 «официант» проходит за столом к окну и обратно, не останавливается"}
  - {from: 546, to: 557, what: "9:06–9:17 конец записи: гость вернулся, люди у камеры, камеру снимают"}
notes: >
  постановка, 2 человека, официант в чёрной футболке и шортах, гость в голубом поло и тёмных брюках.
  Внимание: после ухода гостя (8:17) до конца файла 60 с, а до возвращения людей в 9:06 — 49 с; правило системы
  «ушли» = 90 с отсутствия, поэтому left/cleaned система на этом файле подтвердить не может по построению.
