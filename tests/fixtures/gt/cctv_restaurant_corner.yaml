# Ручная разметка событий: data/videos/cctv_restaurant_corner.mp4 (содержательная часть 0–48 с, дальше чёрный экран).
# Размечено по раскадровке (кадр каждые 1.5–5 с), один разметчик, без перекрёстной проверки.
# Соглашение: столы, занятые с первого кадра, размечены как seated в t=0 (система обязана их «увидеть»).
video: cctv_restaurant_corner.mp4
zones: configs/zones/cctv_restaurant_corner.yaml
events:
  - {t: 0.0, zone: T02, event: seated}   # двое у задней стены
  - {t: 0.0, zone: T03, event: seated}   # компания в центре (мужчина и две дамы)
  - {t: 0.0, zone: T04, event: seated}   # у окна справа, видны частично
  - {t: 0.0, zone: T05, event: seated}   # женщина в жёлтом, ест
  - {t: 0.0, zone: T06, event: seated}   # женщина с меню
  - {t: 3.5, zone: T03, event: staff_visit}  # официант в чёрном наклоняется к столу, ~3.5–9.5 с
notes: >
  T01 и T07 пусты всю запись. Около 10 с через зал проходят новые гости (мужчина в сером пальто и лысый
  мужчина), к 35–45 с они стоят справа у T04/T07, но до конца записи не садятся.
