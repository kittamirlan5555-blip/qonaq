# Независимая проверка на чужой камере (EVAL «Hog's Breath, двор»): запись трансляции заведения, 1080p.
# Пороги — БОЕВЫЕ по умолчанию (SPEC §5), ничего не подогнано под запись. Только детектор — профиль GPU (S2):
# YOLOX-m, 2 тайла (широкий кадр 16:9, люди мелкие у дальних столов), process_fps: auto (D-043).
site_id: elbo_patio
name: Elbo Room патио (отложенная проверка)
