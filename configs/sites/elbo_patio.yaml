process_fps: auto
pose: true
detector:
  backend: onnx
  onnx_model: yolox_m
  onnx_tiles: 2
  device: auto
cameras:
  - id: elbo_patio
    source: data/videos/live/elbo_patio_from1020.mp4
    zones: configs/zones/elbo_patio_seats.yaml
