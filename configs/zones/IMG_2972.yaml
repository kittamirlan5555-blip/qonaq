# T01 поправлен вручную по детекциям в ключевых моментах: стол + стулья, справа граница x=610 — дальше проход к окну.
camera_id: IMG_2972
frame_size: [1080, 1920]
zones:
- id: T01
  type: table
  name: Стол 1
  polygon:
  - [0.0, 1170.0]
  - [610.0, 1170.0]
  - [610.0, 1920.0]
  - [0.0, 1920.0]
