# Одна зона-«стол» на левую часть кадра вебкамеры. Координаты заданы для кадра 1280x720 и
# автоматически пересчитываются под реальное разрешение камеры.
# Свой вариант: python -m qonaq zones edit <снимок_с_камеры.jpg> --zones configs/zones/demo_webcam.yaml
camera_id: webcam
frame_size: [1280, 720]
zones:
- id: T01
  type: table
  name: Мой стол
  polygon: [[40, 60], [760, 60], [760, 700], [40, 700]]
