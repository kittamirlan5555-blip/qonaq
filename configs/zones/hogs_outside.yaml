# Hog's Breath, двор (запись трансляции, 1920×1080). Автопредложение (configs/zones/auto/hogs_outside_suggest.yaml)
# нашло 8 «столов»: столешницы центра, низа слева/справа и дальнего правого стола (без стульев — сидящие гости
# не попадали бы в зону), барные табуреты слева (не стол), 3 стола заднего ряда (перекрыты толпой — не размечены)
# и не нашло стол у правого края. Поправлено вручную по кадрам: зона = столешница + стулья, где сидят гости.
camera_id: hogs_outside
frame_size: [1920, 1080]
zones:
- id: T01
  type: table
  name: центр
  polygon: [[800, 430], [1180, 430], [1250, 600], [1200, 810], [820, 830], [770, 640]]
- id: T02
  type: table
  name: низ справа
  polygon: [[1370, 800], [1700, 800], [1760, 1080], [1330, 1080]]
- id: T03
  type: table
  name: низ слева
  polygon: [[300, 820], [920, 820], [960, 1080], [260, 1080]]
- id: T04
  type: table
  name: справа у края
  polygon: [[1640, 600], [1920, 600], [1920, 860], [1700, 900], [1600, 760]]
- id: T05
  type: table
  name: дальний справа
  polygon: [[1620, 400], [1880, 400], [1900, 590], [1640, 590]]
