# D-044: зоны по посадочным местам (Hog's Breath, двор). Нарисованы по бёдрам сидящих (поза) в окне калибровки 0–15 мин
# (в оценку не входит): полигон = места вокруг стола + полоса, где стоит подошедший официант; проход и задний ряд — снаружи.
# Якорь `hips`: человек «у стола», если его бёдра (по ключевым точкам) внутри — рамка, наполовину заходящая в полигон
# (люди заднего ряда и прохода, EVAL §26), больше не считается.
