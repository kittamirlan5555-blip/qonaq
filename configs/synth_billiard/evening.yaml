# Вечер в бильярдной, 2 стола, 60 минут, камера под углом (B4). Все сценарии B2 в одном ролике.
# Правда (интервалы игры) выводится из сценария при рендере: [первый удар, шары остановились после последнего].
name: billiard_evening
fps: 2
duration_s: 3600
view: angled
flicker: 0.03          # лампы мерцают ±3%
room_light: 0.45
seed: 3
tables:
  - {id: B1, origin: [0.9, 0.9]}
  - {id: B2, origin: [4.4, 0.9], felt: blue}
timeline:
  # B1: две игры с перерывом 15 минут (> P = 10 мин) — две сессии; потом свет над столом выключили
  - {table: B1, game: [120, 1500], every: [25, 70], seed: 11}
  - {table: B1, game: [2400, 3300], every: [25, 70], seed: 12}
  - {table: B1, lamp: [[0, 3450]]}
  # B2: «между делом» два удара (меньше K=3 за 5 мин); стоит у стола, опершись на борт; игра с паузой 6 мин
  # (одна сессия); протирка сукна в паузе; стол накрыли; лампа погасла
  - {table: B2, shot: 400}
  - {table: B2, shot: 650}
  - {table: B2, lean: [900, 1200]}
  - {table: B2, game: [1300, 1900], every: [25, 60], seed: 21}
  - {table: B2, brush: [2000, 2200]}
  - {table: B2, game: [2260, 2900], every: [25, 60], seed: 22}
  - {table: B2, cover: [3000, 3600]}
  - {table: B2, lamp: [[0, 2950]]}
  # люди ходят по залу: вдоль столов и между ними (игроки B1 проходят у B2)
  - {walk: [[60, 0.2, 2.55], [200, 7.8, 2.55], [340, 0.2, 2.55]]}
  - {walk: [[1000, 3.9, 4.4], [1060, 3.9, 0.3], [1120, 3.9, 4.4]]}
  - {walk: [[1600, 7.8, 0.4], [1700, 0.2, 0.4]]}
  - {walk: [[2500, 0.2, 2.5], [2650, 7.8, 2.5]]}
